version: '3.8'

services:
 backend:
  build: ./backend
  ports:
   - 8000:8000
  volumes: 
   - ./backend:/app
  restart: always

 frontend:
  build: ./frontend
  ports:
   - 8501:8501
  volumes:
   - ./frontend:/app
  restart: always

  nginx:
   image: nginx:alpine
   ports:
     - "80:80"
   volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
   depends_on:
     - backend
     - frontend
